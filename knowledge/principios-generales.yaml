# 📜 Principios Generales del Derecho Colombiano
# Skill: derecho-general — AgentOS R2 Legal
# Versión: 1.0

principios:
  - nombre: "Buena fe"
    articulo: "Art. 83 Constitución Política"
    definición: |
      Las actuaciones de los particulares y de las autoridades públicas deberán ceñirse
      a los postulados de la buena fe, la cual se presume en todas las gestiones que
      aquellos adelanten ante estas.
    aplicación: |
      Se presume la buena fe del deudor. Quien alega mala fe debe probarla.
      Aplica en: contratos, procesos ejecutivos, actuaciones administrativas.

  - nombre: "Igualdad"
    articulo: "Art. 13 Constitución Política"
    definición: |
      Todas las personas nacen libres e iguales ante la ley, recibirán la misma protección
      y trato de las autoridades y gozarán de los mismos derechos, libertades y oportunidades
      sin ninguna discriminación.
    aplicación: |
      El Estado promueve condiciones de igualdad real y adopta medidas en favor de grupos
      discriminados o marginados.

  - nombre: "Debido proceso"
    articulo: "Art. 29 Constitución Política"
    definición: |
      El debido proceso se aplicará a toda clase de actuaciones judiciales y administrativas.
      Nadie podrá ser juzgado sino conforme a leyes preexistentes, ante juez o tribunal
      competente y con observancia de la plenitud de las formas propias de cada juicio.
    aplicación: |
      Toda actuación procesal debe respetar: competencia del juez, forma establecida,
      derechos de defensa y contradicción, publicidad, imparcialidad, doble instancia.

  - nombre: "Favorabilidad"
    articulo: "Principio general del derecho"
    definición: |
      En caso de conflicto normativo o duda en la interpretación, debe aplicarse la norma
      más favorable al destinatario, especialmente en materia laboral y penal.
    aplicación: |
      Aplica en: derecho laboral (art. 21 CST), derecho penal (art. 6 CP), interpretación
      de contratos (art. 1624 CC).

  - nombre: "Non bis in ídem"
    articulo: "Art. 29 Constitución Política (implícito)"
    definición: |
      Nadie podrá ser juzgado dos veces por el mismo hecho.
    aplicación: |
      Prohibición de doble procesamiento por la misma causa. Opera cosa juzgada.

  - nombre: "Pro homine / pro actione"
    articulo: "Principio general del derecho internacional de los derechos humanos"
    definición: |
      En caso de duda, debe preferirse la interpretación que más favorezca la protección
      de los derechos humanos y el acceso a la administración de justicia.
    aplicación: |
      Las normas procesales se interpretan en el sentido más favorable para que el proceso
      cumpla su finalidad: la efectividad de los derechos sustanciales.

  - nombre: "Seguridad jurídica"
    articulo: "Principio general del derecho"
    definición: |
      Las situaciones jurídicas consolidadas deben ser respetadas. El derecho debe ser
      previsible, estable y coherente.
    aplicación: |
      Fundamento de: cosa juzgada, prescripción, caducidad, irretroactividad de la ley.

fuentes_consultadas:
  - Constitución Política de Colombia de 1991
  - Código Civil (Ley 57 de 1887)
  - Código General del Proceso (Ley 1564 de 2012)
  - Código Sustantivo del Trabajo
  - Jurisprudencia Corte Constitucional
