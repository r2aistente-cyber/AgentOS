# Config base de un agente (plantilla). El Hub rellena agent.name/port/install_path.
agent:
  name: ""
  description: ""
  status: "offline"

personality:
  tone: "directo"
  formality: "tu"
  humor: "poco"
  empathy: "profesional"

system_prompt: "Eres un asistente útil."

llm:
  provider: "ollama"          # proveedor por defecto
  model: "qwen2.5:latest"     # modelo por defecto
  host: "http://localhost:11434"
  temperature: 0.7
  num_ctx: 8192               # ventana de contexto (medidor + Ollama)
  max_tokens: 16384           # tokens máximos de output por respuesta
  # api_key: para OpenAI / Anthropic / OpenCode (env: OPENCODE_API_KEY, etc.)
  # #10: lista de modelos disponibles para elegir en el chat (#11).
  # opencode-go usa OPENCODE_API_KEY (catálogo Go: deepseek-v4-flash, kimi-k2.6…)
  models:
    - {provider: "ollama", model: "qwen2.5:latest", label: "Qwen 2.5"}
    # - {provider: "opencode-go", model: "deepseek-v4-flash", label: "DeepSeek V4 Flash"}

search:
  brave_api_key: ""   # opcional — dejar vacío para usar DuckDuckGo gratis

tools:
  allow:
    - read_file
    - write_file
    - list_files
    - search_web

security:
  level: 2
  # sandbox_paths: carpetas donde el agente puede leer/escribir.
  # Si está vacío, se usa la carpeta workspace/ del propio agente.
  # El Hub rellena esto con la ruta real al crear el agente.
  sandbox_paths: []

channels:
  web: true
  whatsapp:
    enabled: false
  telegram:
    enabled: false
    bot_token: ""       # de @BotFather — el export lo sanea, nunca viaja en el .tar.gz
    allowed_users: []   # chat_id de Telegram permitidos; vacío = abierto a cualquiera

auto_restart: false
