profile: core
version: "1.1"

server:
  port: 8234

llm:
  provider: ollama
  model: qwen2.5:latest
  host: http://localhost:11434
  temperature: 0.7
  max_tokens: 4096

channels:
  web: true
  whatsapp:
    enabled: false
    phone: "+573192270876"

security:
  default_level: 3
  sandbox_paths:
    - ~/Trantor/
    - ~/Documents/
    - ~/r2-autonomous/
    - /tmp/

tools:
  base:
    - read_file
    - write_file
    - list_files
    - search_web
    - fetch_url
    - save_memory
    - get_memory
  comms:
    - send_whatsapp

specialty: core
