# AgentOS Configuration

hub:
  name: "AgentOS"
  port: 8234
  templates_dir: "~/AgentOS/templates"
  log_dir: "~/AgentOS/logs"

  port_range:
    start: 9000
    end: 9999

  health_check:
    interval_seconds: 15
    timeout_seconds: 5
    auto_restart: true

  api_keys:
    openai: "${OPENAI_API_KEY}"
    anthropic: "${ANTHROPIC_API_KEY}"
    google: "${GOOGLE_API_KEY}"

  api_key_inheritance: true
