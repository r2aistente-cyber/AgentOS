<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgentOS — Mockup</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #1e1e2e;
    --fg: #cdd6f4;
    --muted: #6c7086;
    --surface: #313244;
    --surface2: #45475a;
    --accent: #89b4fa;
    --green: #a6e3a1;
    --red: #f38ba8;
    --yellow: #f9e2af;
    --blue: #89b4fa;
    --border: #45475a;
    --titlebar: #181825;
  }
  body {
    margin: 0;
    background: #11111b;
    color: var(--fg);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  main {
    max-width: 1100px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title { font-size: 18px; font-weight: 700; fill: var(--fg); }
  .label { font-size: 13px; font-weight: 600; fill: var(--fg); }
  .small { font-size: 11px; fill: var(--muted); }
  .badge { font-size: 10px; font-weight: 700; }
  .green { fill: var(--green); }
  .red { fill: var(--red); }
  .accent { fill: var(--accent); }
  .yellow { fill: var(--yellow); }
  .border { stroke: var(--border); stroke-width: 1; }
  .surface { fill: var(--surface); }
  .surface2 { fill: var(--surface2); }
  .titlebar { fill: var(--titlebar); }
  .muted { fill: var(--muted); }
</style>
